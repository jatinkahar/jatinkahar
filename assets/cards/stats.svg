<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 495 195"
     width="495"
     height="195"
     role="img"
     aria-label="Jatin Kahar GitHub Stats">

<defs>

<style><![CDATA[

text{
 font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace
}

@keyframes popUp{
 0%{
  opacity:0;
 }
 100%{
  opacity:1;
 }
}

@keyframes pulseDot{
 0%,100%{
  transform:scale(1);
  opacity:.7;
 }
 50%{
  transform:scale(1.3);
  opacity:1;
 }
}

.card-anim{
 animation:popUp .6s ease forwards;
}

.dot-pulse{
 transform-box:fill-box;
 transform-origin:center;
 animation:pulseDot 2s ease-in-out infinite;
}

]]></style>


<!-- Background -->

<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#050816"/>
 <stop offset="100%" stop-color="#0b1120"/>
</linearGradient>


<!-- Border -->

<linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#3b82f6" stop-opacity=".6"/>
 <stop offset="50%" stop-color="#06b6d4" stop-opacity=".3"/>
 <stop offset="100%" stop-color="#1e3a8a" stop-opacity=".6"/>
</linearGradient>


<!-- Clip Boundary -->

<clipPath id="cardClip">
 <rect x="0"
       y="0"
       width="495"
       height="195"
       rx="14"/>
</clipPath>


</defs>


<!-- Everything inside card -->

<g clip-path="url(#cardClip)">


<!-- Card Background -->

<rect x="1.5"
      y="1.5"
      width="492"
      height="192"
      rx="14"
      fill="url(#bgGrad)"
      stroke="url(#borderGrad)"
      stroke-width="1.5"/>



<!-- Header -->

<g transform="translate(25,32)">

 <circle cx="6"
         cy="6"
         r="4"
         fill="#3b82f6"
         class="dot-pulse"/>


 <text x="22"
       y="11"
       font-size="14"
       font-weight="bold"
       fill="#f8fafc"
       letter-spacing=".5">
 Jatin Kahar's GitHub Stats
 </text>


 <line x1="0"
       y1="22"
       x2="445"
       y2="22"
       stroke="#1e293b"
       stroke-width="1"/>

</g>



<!-- Stats Grid -->

<g transform="translate(25,70)"
   class="card-anim">



<!-- Stars -->

<g transform="translate(0,0)">

<rect width="135"
      height="42"
      rx="8"
      fill="#0f172a"
      stroke="#1e293b"/>

<text x="14"
      y="26"
      font-size="13"
      fill="#94a3b8">
⭐ Total Stars:
</text>

<text x="123"
      y="26"
      text-anchor="end"
      font-size="13"
      font-weight="bold"
      fill="#38bdf8">
48
</text>

</g>



<!-- Commits -->

<g transform="translate(150,0)">

<rect width="135"
      height="42"
      rx="8"
      fill="#0f172a"
      stroke="#1e293b"/>

<text x="14"
      y="26"
      font-size="13"
      fill="#94a3b8">
💻 Commits:
</text>

<text x="123"
      y="26"
      text-anchor="end"
      font-size="13"
      font-weight="bold"
      fill="#60a5fa">
520+
</text>

</g>



<!-- Pull Requests -->

<g transform="translate(300,0)">

<rect width="145"
      height="42"
      rx="8"
      fill="#0f172a"
      stroke="#1e293b"/>

<text x="14"
      y="26"
      font-size="13"
      fill="#94a3b8">
🔀 Pull Req:
</text>

<text x="132"
      y="26"
      text-anchor="end"
      font-size="13"
      font-weight="bold"
      fill="#34d399">
18
</text>

</g>




<!-- Contributions -->

<g transform="translate(0,54)">

<rect width="135"
      height="42"
      rx="8"
      fill="#0f172a"
      stroke="#1e293b"/>

<text x="14"
      y="26"
      font-size="13"
      fill="#94a3b8">
🔥 Contribs:
</text>

<text x="123"
      y="26"
      text-anchor="end"
      font-size="13"
      font-weight="bold"
      fill="#f43f5e">
340+
</text>

</g>




<!-- Repositories -->

<g transform="translate(150,54)">

<rect width="135"
      height="42"
      rx="8"
      fill="#0f172a"
      stroke="#1e293b"/>

<text x="14"
      y="26"
      font-size="13"
      fill="#94a3b8">
📦 Repos:
</text>

<text x="123"
      y="26"
      text-anchor="end"
      font-size="13"
      font-weight="bold"
      fill="#c084fc">
12
</text>

</g>




<!-- Rank -->

<g transform="translate(300,54)">

<rect width="145"
      height="42"
      rx="8"
      fill="#0f172a"
      stroke="#1e293b"/>

<text x="14"
      y="26"
      font-size="13"
      fill="#94a3b8">
🏆 Rank:
</text>

<text x="132"
      y="26"
      text-anchor="end"
      font-size="13"
      font-weight="bold"
      fill="#fde047">
Top 15%
</text>

</g>


</g>


</g>


</svg>
