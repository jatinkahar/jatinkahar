<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 495 195" width="495" height="195" role="img" aria-label="Jatin Kahar Most Used Languages">
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes barGrow{from{width:0%}to{opacity:1}}
.bar{animation:barGrow 1.2s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.3);opacity:1}}
.dot-pulse{transform-box:fill-box;transform-origin:center;animation:pulseDot 2s ease-in-out infinite}
]]></style>

<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#050816"/>
  <stop offset="100%" stop-color="#0b1120"/>
</linearGradient>

<linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#3b82f6" stop-opacity=".6"/>
  <stop offset="50%" stop-color="#06b6d4" stop-opacity=".3"/>
  <stop offset="100%" stop-color="#1e3a8a" stop-opacity=".6"/>
</linearGradient>

<!-- Language Gradients -->
<linearGradient id="javaGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
<linearGradient id="pythonGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
<linearGradient id="sqlGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
<linearGradient id="webGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#e879f9"/></linearGradient>
</defs>

<!-- Card Background -->
<rect x="1.5" y="1.5" width="492" height="192" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

<!-- Header Title -->
<g transform="translate(25, 32)">
  <circle cx="6" cy="6" r="4" fill="#06b6d4" class="dot-pulse"/>
  <text x="22" y="11" font-size="14" font-weight="bold" fill="#f8fafc" letter-spacing=".5">Most Used Languages</text>
  <line x1="0" y1="22" x2="445" y2="22" stroke="#1e293b" stroke-width="1"/>
</g>

<!-- Multi-color Segmented Progress Bar -->
<g transform="translate(25, 70)">
  <rect x="0" y="0" width="445" height="10" rx="5" fill="#0f172a"/>
  <!-- Java 45% -->
  <rect x="0" y="0" width="200" height="10" rx="5" fill="url(#javaGrad)"/>
  <!-- Python 25% -->
  <rect x="203" y="0" width="111" height="10" rx="2" fill="url(#pythonGrad)"/>
  <!-- SQL 18% -->
  <rect x="317" y="0" width="80" height="10" rx="2" fill="url(#sqlGrad)"/>
  <!-- Web/JS 12% -->
  <rect x="400" y="0" width="45" height="10" rx="2" fill="url(#webGrad)"/>
</g>

<!-- Language Breakdown List -->
<g transform="translate(25, 105)">
  <!-- Java -->
  <g transform="translate(0, 0)">
    <circle cx="6" cy="6" r="5" fill="#3b82f6"/>
    <text x="20" y="10" font-size="13" font-weight="bold" fill="#e2e8f0">Java</text>
    <text x="130" y="10" font-size="12" fill="#94a3b8">45.0%</text>
  </g>

  <!-- Python -->
  <g transform="translate(230, 0)">
    <circle cx="6" cy="6" r="5" fill="#06b6d4"/>
    <text x="20" y="10" font-size="13" font-weight="bold" fill="#e2e8f0">Python</text>
    <text x="130" y="10" font-size="12" fill="#94a3b8">25.0%</text>
  </g>

  <!-- SQL -->
  <g transform="translate(0, 35)">
    <circle cx="6" cy="6" r="5" fill="#6366f1"/>
    <text x="20" y="10" font-size="13" font-weight="bold" fill="#e2e8f0">SQL</text>
    <text x="130" y="10" font-size="12" fill="#94a3b8">18.0%</text>
  </g>

  <!-- HTML / JS -->
  <g transform="translate(230, 35)">
    <circle cx="6" cy="6" r="5" fill="#c084fc"/>
    <text x="20" y="10" font-size="13" font-weight="bold" fill="#e2e8f0">HTML / JS</text>
    <text x="130" y="10" font-size="12" fill="#94a3b8">12.0%</text>
  </g>
</g>

</svg>
