<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 660" width="420" height="660" role="img" aria-label="Jatin Kahar ID card lanyard">
<title>Jatin Kahar — swinging ID badge</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes settle{0%{transform:rotate(0deg) translateY(-660px)}18%{transform:rotate(0deg) translateY(0)}30%{transform:rotate(13deg)}46%{transform:rotate(-9deg)}62%{transform:rotate(6deg)}78%{transform:rotate(-3.5deg)}92%{transform:rotate(1.5deg)}100%{transform:rotate(0deg)}}
@keyframes sway{0%,100%{transform:rotate(-3.2deg)}50%{transform:rotate(3.2deg)}}
@keyframes cardWobble{0%,100%{transform:rotate(1.6deg)}50%{transform:rotate(-1.6deg)}}
@keyframes shine{0%{transform:translateX(-340px) skewX(-18deg)}55%,100%{transform:translateX(420px) skewX(-18deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.settle{transform-origin:210px 6px;animation:settle 3.4s cubic-bezier(.34,1.1,.5,1) forwards}
.sway{transform-origin:210px 6px;animation:sway 4.2s ease-in-out 3.4s infinite}
.wob{transform-origin:210px 300px;animation:cardWobble 4.2s ease-in-out 3.4s infinite}
.shine{animation:shine 4.5s ease-in-out 3.6s infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
@keyframes fillBar{from{width:0%}to{width:100%}}
.skill-fill{animation: fillBar 1.5s ease-out forwards;}
]]></style>

<!-- Gradient Definitions (Blue / Cyan Theme) -->
<linearGradient id="strapg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#1e40af"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/>
</linearGradient>
<linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#050816"/>
</linearGradient>
<linearGradient id="cardborder" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%"><animate attributeName="stop-color" values="#3b82f6;#06b6d4;#60a5fa;#3b82f6" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#06b6d4;#3b82f6;#60a5fa;#06b6d4" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#93c5fd"/><stop offset="45%" stop-color="#3b82f6"/><stop offset="55%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#60a5fa"/>
</linearGradient>
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".14"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>

<!-- Holographic Blue/Cyan Name Gradient -->
<linearGradient id="nameg2" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#38bdf8">
    <animate attributeName="stop-color" values="#38bdf8;#3b82f6;#06b6d4;#38bdf8" dur="4s" repeatCount="indefinite"/>
  </stop>
  <stop offset="50%" stop-color="#3b82f6">
    <animate attributeName="stop-color" values="#3b82f6;#06b6d4;#38bdf8;#3b82f6" dur="4s" repeatCount="indefinite"/>
  </stop>
  <stop offset="100%" stop-color="#06b6d4">
    <animate attributeName="stop-color" values="#06b6d4;#38bdf8;#3b82f6;#06b6d4" dur="4s" repeatCount="indefinite"/>
  </stop>
</linearGradient>

<radialGradient id="lglow"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".2"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<filter id="glow2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".65"/></filter>

<!-- Clip path for the photo -->
<clipPath id="avatarClip"><circle cx="210" cy="400" r="60" /></clipPath>
</defs>

<!-- Background Glow -->
<circle cx="210" cy="440" r="230" fill="url(#lglow)"><animate attributeName="r" values="230;250;230" dur="5s" repeatCount="indefinite"/></circle>

<!-- Animated Decorations -->
<g class="tw" style="animation-delay:.5s"><path d="M60 200l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#38bdf8"/></g>
<g class="tw" style="animation-delay:1.6s"><path d="M372 300l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#06b6d4"/></g>
<g class="tw" style="animation-delay:2.7s"><path d="M52 480l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#60a5fa"/></g>

<!-- pendulum: settle then sway -->
<g class="settle"><g class="sway">

  <!-- Strap -->
  <g>
    <path d="M191 -6 L229 -6 L226 236 L194 236 Z" fill="url(#strapg)"/>
    <line x1="196" y1="0" x2="198.5" y2="234" stroke="#fff" stroke-opacity=".55" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="224" y1="0" x2="221.5" y2="234" stroke="#fff" stroke-opacity=".55" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="0" y="0" font-size="10.5" font-weight="bold" fill="#fff" opacity=".92" letter-spacing="2" transform="translate(214,18) rotate(90)">TCS ♥ JAVA BACKEND ♥ JATIN KAHAR</text>
  </g>

  <!-- Clasp + ring -->
  <rect x="188" y="232" width="44" height="26" rx="6" fill="url(#metal)" stroke="#1e3a8a" stroke-width="1"/>
  <rect x="199" y="238" width="22" height="7" rx="3.5" fill="#172554"/>
  <circle cx="210" cy="272" r="14" fill="none" stroke="url(#metal)" stroke-width="5.5"/>

  <!-- Card (secondary wobble) -->
  <g class="wob">
    <rect x="82" y="298" width="256" height="330" rx="20" fill="url(#cardg)" stroke="url(#cardborder)" stroke-width="2" filter="url(#cardShadow)"/>
    <!-- slot -->
    <rect x="180" y="310" width="60" height="10" rx="5" fill="#030712" stroke="#1e3a8a" stroke-width="1"/>

    <!-- Card Content - Fades in after card settles -->
    <g style="animation: fadeIn 0.5s ease 3.8s forwards; opacity:0;">

      <!-- Header band -->
      <rect x="82" y="298" width="256" height="34" fill="#0f172a" opacity=".8" rx="20" ry="20" clip-path="url(#cardclip-header)"/>
       <clipPath id="cardclip-header"><rect x="82" y="298" width="256" height="34" rx="20"/></clipPath>

      <text x="98" y="321" font-size="9.5" fill="#93c5fd" letter-spacing="1" font-weight="bold">ASSISTANT SYS ENG @ TCS</text>
      <text x="322" y="321" text-anchor="end" font-size="10" fill="#38bdf8" letter-spacing="1.5">ID: JK-2026</text>

      <!-- Avatar Area -->
      <circle cx="210" cy="400" r="62" fill="none" stroke="url(#cardborder)" stroke-width="3"/>
      <!-- Jatin's Reference Face Image -->
      <image x="150" y="340" width="120" height="120" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice" xlink:href="./assets/images/a.jpg"/>

      <!-- Name (Holographic Blue/Cyan Gradient) -->
      <text x="210" y="495" text-anchor="middle" font-size="28" font-weight="bold" fill="url(#nameg2)" filter="url(#glow2)">Jatin Kahar</text>
      <text x="210" y="515" text-anchor="middle" font-size="13" fill="#60a5fa">Java Full Stack Developer</text>

      <!-- Skills Section -->
      <g transform="translate(105, 538)">
        <!-- Skill 1: Java -->
        <text x="0" y="0" font-size="11.5" fill="#e2e8f0">Java Backend</text>
        <rect x="0" y="7" width="210" height="5.5" rx="2.75" fill="#1e293b"/>
        <rect x="0" y="7" width="189" height="5.5" rx="2.75" fill="#3b82f6" class="skill-fill" style="animation-delay: 4.2s;"/>

        <!-- Skill 2: Spring Boot -->
        <text x="0" y="27" font-size="11.5" fill="#e2e8f0">Spring Boot</text>
        <rect x="0" y="34" width="210" height="5.5" rx="2.75" fill="#1e293b"/>
        <rect x="0" y="34" width="178" height="5.5" rx="2.75" fill="#06b6d4" class="skill-fill" style="animation-delay: 4.4s;"/>

        <!-- Skill 3: SQL / Docker -->
        <text x="0" y="54" font-size="11.5" fill="#e2e8f0">SQL &amp; Docker</text>
        <rect x="0" y="61" width="210" height="5.5" rx="2.75" fill="#1e293b"/>
        <rect x="0" y="61" width="168" height="5.5" rx="2.75" fill="#60a5fa" class="skill-fill" style="animation-delay: 4.6s;"/>
      </g>

      <!-- Footer Code Icon -->
      <text x="210" y="620" text-anchor="middle" font-size="13" fill="#3b82f6">&lt;/&gt;</text>

    </g>

    <!-- Card Shine Animation -->
    <rect x="82" y="298" width="256" height="330" rx="20" fill="url(#shineg)" class="shine" pointer-events="none"/>

  </g>
</g></g>

</svg>
