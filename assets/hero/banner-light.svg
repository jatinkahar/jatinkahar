<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 160" width="100%" height="100%" role="img" aria-label="Jatin Kahar Light Banner">
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes floatSlowLight{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fl{animation:floatSlowLight 5s ease-in-out infinite}
]]></style>

<!-- Light Theme Gradients -->
<linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#f8fafc"/>
  <stop offset="50%" stop-color="#f1f5f9"/>
  <stop offset="100%" stop-color="#e2e8f0"/>
</linearGradient>

<linearGradient id="cardBgLight" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
  <stop offset="100%" stop-color="#f8fafc" stop-opacity=".95"/>
</linearGradient>

<linearGradient id="borderGradLight" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#3b82f6" stop-opacity=".4"/>
  <stop offset="100%" stop-color="#06b6d4" stop-opacity=".4"/>
</linearGradient>

<linearGradient id="nameGradLight" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#1d4ed8"/>
  <stop offset="100%" stop-color="#0891b2"/>
</linearGradient>

<filter id="cardShadowLight" x="-10%" y="-10%" width="120%" height="120%">
  <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#64748b" flood-opacity=".15"/>
</filter>

<clipPath id="avatarClipLight">
  <circle cx="985" cy="80" r="45"/>
</clipPath>
</defs>

<!-- Background -->
<rect width="1100" height="160" fill="url(#bgLight)" rx="16"/>

<!-- Main Container -->
<g transform="translate(30, 15)">
  <!-- Left Glass Panel -->
  <rect x="0" y="0" width="810" height="130" rx="12" fill="url(#cardBgLight)" stroke="url(#borderGradLight)" stroke-width="1.2" filter="url(#cardShadowLight)"/>
  
  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="4" height="130" rx="2" fill="#3b82f6"/>

  <g transform="translate(25, 20)">
    <!-- Pill -->
    <rect x="0" y="0" width="175" height="20" rx="5" fill="#e0f2fe"/>
    <circle cx="10" cy="10" r="3" fill="#2563eb"/>
    <text x="20" y="14" font-size="9" fill="#1d4ed8" font-weight="bold">TCS • ASSISTANT SYS ENG</text>

    <!-- Name -->
    <text x="0" y="52" font-size="28" font-weight="bold" fill="url(#nameGradLight)" letter-spacing=".5">Jatin Kahar</text>
    
    <!-- Subtitle -->
    <text x="0" y="72" font-size="11" fill="#64748b" letter-spacing=".8">JAVA BACKEND DEVELOPER &amp; SPRING BOOT ENTHUSIAST</text>

    <!-- Badges Row -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="75" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width=".8"/>
      <text x="37.5" y="14" text-anchor="middle" font-size="9.5" fill="#1d4ed8">Spring Boot</text>

      <rect x="83" y="0" width="68" height="22" rx="4" fill="#ecfeff" stroke="#a5f3fc" stroke-width=".8"/>
      <text x="117" y="14" text-anchor="middle" font-size="9.5" fill="#0891b2">REST APIs</text>

      <rect x="159" y="0" width="60" height="22" rx="4" fill="#e0e7ff" stroke="#c7d2fe" stroke-width=".8"/>
      <text x="189" y="14" text-anchor="middle" font-size="9.5" fill="#4f46e5">Docker</text>

      <rect x="227" y="0" width="55" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width=".8"/>
      <text x="254.5" y="14" text-anchor="middle" font-size="9.5" fill="#059669">Linux</text>

      <rect x="290" y="0" width="65" height="22" rx="4" fill="#fae8ff" stroke="#f5d0fe" stroke-width=".8"/>
      <text x="322.5" y="14" text-anchor="middle" font-size="9.5" fill="#c026d3">Python AI</text>
    </g>
  </g>
</g>

<!-- Right Side Profile Frame -->
<g transform="translate(860, 15)">
  <rect x="0" y="0" width="210" height="130" rx="12" fill="url(#cardBgLight)" stroke="url(#borderGradLight)" stroke-width="1.2" filter="url(#cardShadowLight)"/>
  
  <circle cx="105" cy="65" r="48" fill="none" stroke="#3b82f6" stroke-width="1" opacity=".3"/>
  <circle cx="105" cy="65" r="45" fill="#f1f5f9" stroke="#3b82f6" stroke-width="2"/>
  <image x="60" y="20" width="90" height="90" clip-path="url(#avatarClipLight)" preserveAspectRatio="xMidYMid slice" xlink:href="../images/a.jpg"/>
</g>

</svg>
