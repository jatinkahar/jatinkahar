      <rect

          width="180"

          height="28"

          rx="14"

          fill="#0f172a"

          stroke="#38bdf8"

          stroke-opacity=".45"/>

      <circle
          cx="16"
          cy="14"
          r="4"
          fill="#22c55e">

          <animate
              attributeName="opacity"
              values="1;.2;1"
              dur="2s"
              repeatCount="indefinite"/>

      </circle>

      <text

          x="30"

          y="18"

          font-size="11"

          fill="#38bdf8"

          font-weight="600">

          AVAILABLE FOR WORK

      </text>

  </g>

  <!-- NAME -->

  <text

      x="28"

      y="82"

      font-size="36"

      font-weight="700"

      fill="#ffffff">

      Jatin Kahar

  </text>

  <!-- Glow Name -->

  <text

      x="28"

      y="82"

      font-size="36"

      font-weight="700"

      fill="#38bdf8"

      opacity=".25"

      filter="url(#blur)">

      Jatin Kahar

  </text>

  <!-- Typing Role -->

