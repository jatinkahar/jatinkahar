            dur="8s"
            repeatCount="indefinite"/>

        <rect width="120" height="28" rx="8"
              fill="#111827"
              stroke="#22c55e"/>

        <text x="60" y="18"
              font-size="11"
              fill="#4ade80"
              text-anchor="middle">
            Spring Boot
        </text>
    </g>

    <!-- DOCKER -->

    <g transform="translate(765 28)">
        <animateTransform
            attributeName="transform"
            type="translate"
            values="765 28;765 18;765 28"
            dur="7s"
            repeatCount="indefinite"/>

        <rect width="92" height="28" rx="8"
              fill="#111827"
              stroke="#06b6d4"/>

        <text x="46" y="18"
              font-size="11"
              fill="#67e8f9"
              text-anchor="middle">
            Docker
        </text>
    </g>

</g>

<!-- ================= CIRCUIT LINES ================= -->

<g stroke="#38bdf8"
   stroke-width=".8"
   opacity=".18">

    <path d="M470 95H560V130H640">
        <animate
            attributeName="opacity"
            values=".08;.35;.08"
            dur="3s"
            repeatCount="indefinite"/>
    </path>

    <path d="M720 105H790V150H860">
        <animate
            attributeName="opacity"
            values=".35;.08;.35"
