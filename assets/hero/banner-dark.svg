<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    viewBox="0 0 1100 240"
    width="1100"
    height="240"
>

<defs>

<style><![CDATA[

text{
font-family:Inter,Segoe UI,Arial,sans-serif;
}

@keyframes pulse{
0%{opacity:.25;}
50%{opacity:.9;}
100%{opacity:.25;}
}

@keyframes float1{
0%{transform:translate(0px,0px);}
50%{transform:translate(0px,-20px);}
100%{transform:translate(0px,0px);}
}

@keyframes float2{
0%{transform:translate(0px,0px);}
50%{transform:translate(-30px,18px);}
100%{transform:translate(0px,0px);}
}

@keyframes scan{

0%{
transform:translateX(-1200px);
}

100%{
transform:translateX(1200px);
}

}

@keyframes gridMove{

0%{
transform:translateY(0);
}

100%{
transform:translateY(40px);
}

}

.orb1{

animation:float1 12s ease-in-out infinite;

}

.orb2{

animation:float2 15s ease-in-out infinite;

}

.scan{

animation:scan 9s linear infinite;

}

.grid{

animation:gridMove 10s linear infinite;

}

.glow{

animation:pulse 4s ease infinite;

}

]]></style>

<!-- ========================= -->

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">

<stop offset="0%" stop-color="#050816"/>

<stop offset="50%" stop-color="#08111f"/>

<stop offset="100%" stop-color="#030712"/>

</linearGradient>

<linearGradient id="blueGlow">

<stop offset="0%" stop-color="#3b82f6"/>

<stop offset="100%" stop-color="#06b6d4"/>

</linearGradient>

<linearGradient id="glass">

<stop offset="0%" stop-color="#111827" stop-opacity=".82"/>

<stop offset="100%" stop-color="#0b1120" stop-opacity=".95"/>

</linearGradient>

<filter id="blur">

<feGaussianBlur stdDeviation="35"/>

</filter>

<filter id="shadow">

<feDropShadow
dx="0"
dy="8"
stdDeviation="14"
flood-opacity=".45"/>

</filter>

<clipPath id="avatarClip">
    <circle cx="115" cy="88" r="50"/>
</clipPath>

</defs>

<!-- ========================= -->

<rect
width="1100"
height="240"
rx="18"
fill="url(#bg)"/>

<!-- Glow Left -->

<circle
cx="120"
cy="40"
r="130"
fill="#2563eb"
opacity=".18"
filter="url(#blur)"
class="orb1"/>

<!-- Glow Right -->

<circle
cx="980"
cy="180"
r="150"
fill="#06b6d4"
opacity=".16"
filter="url(#blur)"
class="orb2"/>

<!-- Animated Grid -->

<g
stroke="#17314b"
stroke-width=".6"
opacity=".30"
class="grid">

<path d="M0 40H1100"/>

<path d="M0 80H1100"/>

<path d="M0 120H1100"/>

<path d="M0 160H1100"/>

<path d="M0 200H1100"/>

<path d="M120 0V240"/>

<path d="M240 0V240"/>

<path d="M360 0V240"/>

<path d="M480 0V240"/>

<path d="M600 0V240"/>

<path d="M720 0V240"/>

<path d="M840 0V240"/>

<path d="M960 0V240"/>

</g>

<!-- Floating Particles -->

<g fill="#38bdf8">

<circle cx="80" cy="70" r="2">
<animate attributeName="cy" values="70;55;70"
dur="5s"
repeatCount="indefinite"/>
</circle>

<circle cx="240" cy="170" r="1.5">
<animate attributeName="cy"
values="170;155;170"
dur="7s"
repeatCount="indefinite"/>
</circle>

<circle cx="430" cy="50" r="2">
<animate attributeName="cy"
values="50;65;50"
dur="6s"
repeatCount="indefinite"/>
</circle>

<circle cx="720" cy="170" r="2">
<animate attributeName="cy"
values="170;150;170"
dur="9s"
repeatCount="indefinite"/>
</circle>

<circle cx="1030" cy="80" r="2">
<animate attributeName="cy"
values="80;65;80"
dur="8s"
repeatCount="indefinite"/>
</circle>

</g>

<!-- Scan Line -->

<rect

x="-400"

y="0"

width="220"

height="240"

opacity=".06"

fill="url(#blueGlow)"

transform="skewX(-25)"

class="scan"/>
  <!-- ================= LEFT GLASS PANEL ================= -->

