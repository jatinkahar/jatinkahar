  </g>

</g>

  <!-- ================= RIGHT PROFILE CARD ================= -->

<g transform="translate(835,20)">

    <!-- Glass Card -->
    <rect
        x="0"
        y="0"
        width="230"
        height="200"
        rx="18"
        fill="url(#glass)"
        stroke="url(#blueGlow)"
        stroke-opacity=".25"
        filter="url(#shadow)"/>

    <!-- Outer Glow Ring -->
    <circle
        cx="115"
        cy="88"
        r="66"
        fill="none"
        stroke="#3b82f6"
        stroke-width="1.2"
        opacity=".30">

        <animate
            attributeName="r"
            values="66;69;66"
            dur="3s"
            repeatCount="indefinite"/>

        <animate
            attributeName="opacity"
            values=".25;.75;.25"
            dur="3s"
            repeatCount="indefinite"/>

    </circle>

    <!-- Rotating Ring -->

    <circle
        cx="115"
        cy="88"
        r="60"
        fill="none"
        stroke="#38bdf8"
        stroke-width="2"
        stroke-dasharray="12 8">

        <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 115 88"
            to="360 115 88"
            dur="18s"
            repeatCount="indefinite"/>

    </circle>

    <!-- Reverse Ring -->

    <circle
        cx="115"
        cy="88"
        r="54"
        fill="none"
        stroke="#06b6d4"
        stroke-width="1"
        stroke-dasharray="4 6"
        opacity=".7">

        <animateTransform
            attributeName="transform"
            type="rotate"
            from="360 115 88"
            to="0 115 88"
            dur="12s"
            repeatCount="indefinite"/>

    </circle>

    <!-- Avatar Background -->

    <circle
        cx="115"
        cy="88"
        r="50"
        fill="#08111f"/>

    <!-- GitHub Avatar -->

    <image
        href="https://github.com/jatinkahar.png"
        x="65"
        y="38"
        width="100"
        height="100"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#avatarClip)"/>

    <!-- Inner Border -->

    <circle
        cx="115"
        cy="88"
        r="50"
        fill="none"
        stroke="url(#blueGlow)"
        stroke-width="2"/>

    <!-- Online Badge -->

    <g transform="translate(150,118)">

        <circle
            cx="0"
            cy="0"
            r="7"
            fill="#22c55e">

            <animate
