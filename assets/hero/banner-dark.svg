        <circle
            cx="0"
            cy="0"
            r="12"
            fill="none"
            stroke="#22c55e"
            opacity=".5">

            <animate
                attributeName="r"
                values="7;14;7"
                dur="2s"
                repeatCount="indefinite"/>

            <animate
                attributeName="opacity"
                values=".6;0;.6"
                dur="2s"
                repeatCount="indefinite"/>

        </circle>

    </g>

    <!-- Username -->

    <text
        x="115"
        y="165"
        text-anchor="middle"
        font-size="15"
        fill="#ffffff"
        font-weight="700">

        @jatinkahar

    </text>

    <!-- Small Caption -->

    <text
        x="115"
        y="183"
        text-anchor="middle"
        font-size="10"
        fill="#64748b">

        github.com/jatinkahar

    </text>

</g>

  <!-- ================= FLOATING TECH CARDS ================= -->

<g opacity=".95">

