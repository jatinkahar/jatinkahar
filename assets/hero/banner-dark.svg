repeatCount="indefinite"/>
</circle>

</g>

<!-- ================= SCAN LIGHT ================= -->

<rect
    x="-350"
    y="0"
    width="180"
    height="240"
    fill="url(#blueGlow)"
    opacity=".05"
    transform="skewX(-22)">

    <animate
        attributeName="x"
        values="-350;1200"
        dur="8s"
        repeatCount="indefinite"/>

</rect>

<!-- ================= BORDER GLOW ================= -->

